<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout (~{::title}, ~{::#page-content}, ~{::#page-scripts})}">
<head>
  <title>Join ReWear - Sustainable Community Fashion</title>
</head>
<body>

<div id="page-content" class="container" style="padding-top: 3rem; padding-bottom: 5rem; max-width: 520px;">

  <div style="background: white; border-radius: var(--radius-xl); border: 1px solid var(--border); padding: 2.5rem; box-shadow: var(--shadow-lg);">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon" style="margin: 0 auto 1rem; width: 3rem; height: 3rem; font-size: 1.5rem;">🌱</div>
      <h1 style="font-size: 1.85rem; color: #064E3B;">Join ReWear</h1>
      <p style="color: var(--text-muted); font-size: 0.92rem; margin-top: 0.35rem;">
        Start exchanging and donating pre-owned fashion in your neighborhood
      </p>
    </div>

    <form th:action="@{/register}" method="POST">
      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label class="form-label">Full Name *</label>
        <input type="text" name="name" class="form-input" placeholder="e.g. Maya Lin" required>
      </div>

      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label class="form-label">Email Address *</label>
        <input type="email" name="email" class="form-input" placeholder="maya@example.com" required>
      </div>

      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label class="form-label">Password *</label>
        <input type="password" name="password" class="form-input" placeholder="At least 6 characters" minlength="6" required>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
        <div class="form-group">
          <label class="form-label">City / Community Hub</label>
          <input type="text" name="location" class="form-input" placeholder="e.g. Brooklyn, NY">
        </div>
        <div class="form-group">
          <label class="form-label">Phone (For handover)</label>
          <input type="tel" name="phone" class="form-input" placeholder="e.g. +1 555-0199">
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-bottom: 1.25rem;">
        Create My Account ➔
      </button>

      <div style="text-align: center; font-size: 0.88rem; color: var(--text-muted);">
        Already have an account? 
        <a th:href="@{/login}" style="color: var(--primary); font-weight: 600;">Sign in here</a>
      </div>
    </form>

  </div>

</div>

<div id="page-scripts"></div>

</body>
</html>
