server.port=5000
spring.application.name=rewear-platform

# H2 File-based Embedded Database (Zero Setup & Fast Persistence)
spring.datasource.url=jdbc:h2:file:./data/rewear_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console (accessible at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# File Upload Settings
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=16MB
rewear.upload.dir=./static/uploads

# Thymeleaf Settings
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Sustainability Constants
rewear.impact.textile-kg=0.8
rewear.impact.water-liters=2700
rewear.impact.co2-kg=10.0
