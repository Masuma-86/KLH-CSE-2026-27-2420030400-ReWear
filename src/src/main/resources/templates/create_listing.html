<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout (~{::title}, ~{::#page-content}, ~{::#page-scripts})}">
<head>
  <title>Upload Clothing - ReWear</title>
</head>
<body>

<div id="page-content" class="container" style="padding-top: 2.5rem; padding-bottom: 4rem; max-width: 820px;">

  <div style="margin-bottom: 2rem;">
    <span class="badge badge-green" style="margin-bottom: 0.5rem;">Circular Wardrobe</span>
    <h1 style="font-size: 2.2rem; color: #064E3B;">Upload a Clothing Item</h1>
    <p style="color: var(--text-muted); font-size: 0.95rem;">
      Give your pre-loved clothing a new story. Items listed can be traded or given freely to community members.
    </p>
  </div>

  <div style="background: white; border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 2.25rem; box-shadow: var(--shadow-md);">
    <form th:action="@{/listings/create}" method="POST" enctype="multipart/form-data">
      
      <!-- Image Upload Section -->
      <div class="form-group" style="margin-bottom: 2rem;">
        <label class="form-label">Garment Photo *</label>
        <div style="border: 2px dashed #A7F3D0; border-radius: var(--radius-lg); padding: 2rem; text-align: center; background: #F0FDF4; cursor: pointer; position: relative;">
          <input type="file" name="image_file" id="image-upload" accept="image/*" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;">
          
          <div id="upload-placeholder">
            <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">📸</div>
            <div style="font-weight: 600; color: var(--primary-dark); font-size: 1rem;">Click or drag photo here to upload</div>
            <p style="font-size: 0.82rem; color: var(--text-muted); margin-top: 0.25rem;">Supports JPG, PNG, WEBP (Max 16MB)</p>
          </div>

          <img id="image-preview" src="#" alt="Preview" style="display: none; max-height: 280px; margin: 0 auto; border-radius: var(--radius-md); box-shadow: var(--shadow-sm); object-fit: cover;">
        </div>
        <div style="margin-top: 0.75rem;">
          <label class="form-label" style="font-size: 0.82rem; color: var(--text-muted);">Or paste an image web URL (Optional):</label>
          <input type="url" name="image_url" class="form-input" placeholder="https://images.unsplash.com/...">
        </div>
      </div>

      <!-- Item Title -->
      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label class="form-label">Title / Garment Name *</label>
        <input type="text" name="title" class="form-input" placeholder="e.g. Classic Wool Oversized Trench Coat" required>
      </div>

      <!-- Category & Size Grid -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.5rem;">
        <div class="form-group">
          <label class="form-label">Category *</label>
          <select name="category" class="form-select" required>
            <option value="">-- Choose Category --</option>
            <option value="Women">Women's Fashion</option>
            <option value="Men">Men's Fashion</option>
            <option value="Kids">Kids &amp; Youth</option>
            <option value="Unisex">Unisex</option>
            <option value="Outerwear">Outerwear &amp; Jackets</option>
            <option value="Footwear">Footwear &amp; Shoes</option>
            <option value="Accessories">Bags &amp; Accessories</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Size *</label>
          <select name="size" class="form-select" required>
            <option value="">-- Choose Size --</option>
            <option value="XS">Extra Small (XS)</option>
            <option value="S">Small (S)</option>
            <option value="M">Medium (M)</option>
            <option value="L">Large (L)</option>
            <option value="XL">Extra Large (XL)</option>
            <option value="XXL">XXL</option>
            <option value="Free Size">Free Size / One Size</option>
            <option value="38">Shoe 38</option>
            <option value="40">Shoe 40</option>
            <option value="42">Shoe 42</option>
            <option value="44">Shoe 44</option>
          </select>
        </div>
      </div>

      <!-- Condition & Listing Type Grid -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.5rem;">
        <div class="form-group">
          <label class="form-label">Condition *</label>
          <select name="condition" class="form-select" required>
            <option value="">-- Condition --</option>
            <option value="New with tags">New with tags (Never worn)</option>
            <option value="Like New">Like New (Worn 1-2 times)</option>
            <option value="Gently Used">Gently Used (Minor signs of wear)</option>
            <option value="Well Worn">Well Worn (Fully functional)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Listing Model *</label>
          <select name="listing_type" class="form-select" required>
            <option value="Both">Both (Exchange or Free Donation)</option>
            <option value="Exchange">Exchange Only (Swap for clothing)</option>
            <option value="Donation">Free Donation (Giveaway to someone in need)</option>
          </select>
        </div>
      </div>

      <!-- Brand, Color, Material -->
      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.25rem; margin-bottom: 1.5rem;">
        <div class="form-group">
          <label class="form-label">Brand</label>
          <input type="text" name="brand" class="form-input" placeholder="e.g. Patagonia, Zara, Vintage">
        </div>
        <div class="form-group">
          <label class="form-label">Color</label>
          <input type="text" name="color" class="form-input" placeholder="e.g. Olive Green, Navy">
        </div>
        <div class="form-group">
          <label class="form-label">Material / Fabric</label>
          <input type="text" name="material" class="form-input" placeholder="e.g. 100% Organic Cotton">
        </div>
      </div>

      <!-- Description -->
      <div class="form-group" style="margin-bottom: 2rem;">
        <label class="form-label">Description &amp; Fit Details *</label>
        <textarea name="description" class="form-textarea" rows="4" placeholder="Mention fit, measurements, any tiny imperfections, and why you are parting with it..." required></textarea>
      </div>

      <!-- Action Buttons -->
      <div style="display: flex; gap: 1rem; justify-content: flex-end;">
        <a th:href="@{/listings}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary btn-lg">
          Publish Clothing Listing ➔
        </button>
      </div>

    </form>
  </div>

</div>

<div id="page-scripts"></div>

</body>
</html>
